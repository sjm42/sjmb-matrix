[package]
name = "sjmb_matrix"
version = "1.6.1"
edition = "2024"
resolver = "2"
authors = ["Sami J. Mäkinen <sjm@iki.fi>"]
description = "My Matrix bot"
repository = "https://github.com/sjm42/sjmb-matrix"
readme = "README.md"
keywords = ["matrix", "bot"]
license = "MIT OR Apache-2.0"


[features]
default = ["e2e-encryption"]
e2e-encryption = ["matrix-sdk/e2e-encryption"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
matrix-sdk = { version = "0.19", default-features = false, features = [
    "anyhow",
    "bundled-sqlite",
    "rustls-aws-lc-rs",
] }
regex = "1.13"
rand = "0.10"
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = { version = "3.1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = [
    "derive",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
] }
tokio = { version = "1.53", features = ["full"] }
tempfile = "3.27"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
matrix-sdk-crypto = { version = "0.19", default-features = false }
wiremock = "0.6"

[build-dependencies]
build-data = "0.3"


[profile.release]
lto = "fat"
opt-level = 3

# EOF
